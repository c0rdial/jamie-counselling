<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--bg-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:12px">

</div></body></html>
